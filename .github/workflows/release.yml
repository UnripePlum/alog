name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        working-directory: Alog
        run: |
          swift test
          ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Alog-app
          path: |
            Alog/dist/Alog.dmg
            Alog/dist/Alog.zip
      - name: Attach dmg and zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Alog/dist/Alog.dmg
            Alog/dist/Alog.zip
            update-policy.json
          generate_release_notes: true
