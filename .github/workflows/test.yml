name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: Alog
        run: swift test
      - name: Build .app
        working-directory: Alog
        run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Alog-app
          path: |
            Alog/dist/Alog.app
            Alog/dist/Alog.zip
